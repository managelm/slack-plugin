# Slack App Manifest for ManageLM
# Import this at https://api.slack.com/apps > Create New App > From a manifest
#
# After creating, replace <YOUR_HOST> with your actual plugin host URL.
# For Socket Mode development, the URLs don't matter — just enable Socket Mode.

display_information:
  name: ManageLM
  description: Manage Linux and Windows servers — get alerts, run tasks, scans and searches from Slack.
  long_description: |
    ManageLM brings your server management into Slack. Receive real-time
    notifications for agents, tasks, scans, monitors, backups, certificates,
    credentials and admin sessions, and run tasks, scans and fleet searches,
    all without leaving your workspace.

    Features:
    - Real-time alerts for every ManageLM event
    - /managelm slash command: status, run, task, answer, scan, search
    - Interactive buttons to view task details
    - Channel routing for alerts vs informational events

    Requires a ManageLM account and API key. Learn more at https://www.managelm.com
  background_color: "#1a1a2e"

features:
  bot_user:
    display_name: ManageLM
    always_online: true
  app_home:
    # Run form results reach the user as a direct message from the app when
    # no channel is configured; read-only, the app does not handle replies.
    home_tab_enabled: false
    messages_tab_enabled: true
    messages_tab_read_only_enabled: true
  slash_commands:
    - command: /managelm
      # Replace <YOUR_HOST> with your plugin's public URL
      url: https://<YOUR_HOST>/slack/events
      description: Manage your servers with ManageLM
      usage_hint: "status | run <host> <skill> <task> | task <id> | answer <id> <text> | scan <host> <type> | search <kind> [text] | help"
      should_escape: false

oauth_config:
  scopes:
    bot:
      - chat:write
      - commands
      - views:write

settings:
  interactivity:
    is_enabled: true
    # Replace <YOUR_HOST> with your plugin's public URL
    request_url: https://<YOUR_HOST>/slack/events
  org_deploy_enabled: false
  socket_mode_enabled: false
  token_rotation_enabled: false
